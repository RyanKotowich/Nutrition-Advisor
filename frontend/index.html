<!DOCTYPE html>
<html>
<head>
    <title>AI Nutrition Advisor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>AI Nutrition Advisor</h1>

        <input id="calories" placeholder="Calories">
        <input id="diet" placeholder="Diet type">

        <button onclick="generate()">Generate</button>

        <p id="output"></p>
    </div>

    <script>
        async function generate() {
            let calories = document.getElementById("calories").value;
            let diet = document.getElementById("diet").value;

            try {
                const response = await fetch("http://127.0.0.1:5000/api/plan", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        calories: calories,
                        diet: diet
                    })
                });

                const data = await response.json();
                document.getElementById("output").innerText = data.result;

            } catch (error) {
                document.getElementById("output").innerText = "Error connecting to backend.";
            }
        }
    </script>

</body>
</html>
