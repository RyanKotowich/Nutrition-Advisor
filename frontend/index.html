<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Nutrition Advisor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="bubble">

        <div class="left">

            <h1 class="title">AI Nutrition Advisor</h1>

            <p class="subtitle">
                Research driven nutrition planning powered by AI
            </p>

            <div class="summary">
                <div>System Summary</div>
                <div>Mode: —</div>
                <div>Macros: —</div>
                <div>Status: Ready</div>
            </div>

            <img src="nutrition.png" class="chart">

        </div>

        <div class="right">

            <input id="age" placeholder="Age">
            <input id="weight" placeholder="Weight">
            <input id="calories" placeholder="Calories">
            <input id="diet" placeholder="Diet">
            <input id="goal" placeholder="Goal">

            <button onclick="generate()">Generate Meal Plan</button>

            <div id="output">
                Your plan will appear here
            </div>

        </div>

    </div>

</div>

<script>

async function generate() {

    const age = document.getElementById("age").value;
    const weight = document.getElementById("weight").value;
    const calories = document.getElementById("calories").value;
    const diet = document.getElementById("diet").value;
    const goal = document.getElementById("goal").value;

    document.getElementById("output").innerText = "Generating...";

    try {

        const res = await fetch("http://127.0.0.1:5000/api/plan", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                age,
                weight,
                calories,
                diet,
                goal
            })
        });

        const data = await res.json();

        document.getElementById("output").innerText = data.result;

    } catch (err) {

        document.getElementById("output").innerText =
            "Error connecting to backend";

    }
}

</script>

</body>
</html>
